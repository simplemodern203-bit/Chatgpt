<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glass Mirror 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="scene-bg"></div>

    <main class="hero" id="hero">
      <div class="orb orb-1" aria-hidden="true"></div>
      <div class="orb orb-2" aria-hidden="true"></div>

      <section class="glass-panel" id="panel">
        <p class="tag">FUTURE INTERFACE</p>
        <h1>3D Glass Mirror Experience</h1>
        <p>
          Smooth depth, reflective glass layers, and cinematic glow combined in one
          premium landing experience.
        </p>

        <div class="cta-row">
          <button class="btn btn-primary">Explore</button>
          <button class="btn btn-ghost">Watch Demo</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
